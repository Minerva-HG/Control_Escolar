name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  quality:
    name: Lint y pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm test

      - name: Comprobacion de la aplicacion sin base de datos
        run: npm run smoke
        env:
          POSTGRES_PASSWORD: sin_uso_en_esta_comprobacion
          JWT_SECRET: secreto_de_comprobacion_con_longitud_suficiente_123

  integration:
    name: Migraciones y API contra PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: control_seguimiento
          POSTGRES_USER: seguimiento
          POSTGRES_PASSWORD: seguimiento_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seguimiento -d control_seguimiento"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: control_seguimiento
      POSTGRES_USER: seguimiento
      POSTGRES_PASSWORD: seguimiento_ci
      JWT_SECRET: secreto_de_integracion_para_ci_con_longitud_suficiente
      SEED_TEACHER_EMAIL: maestra@escuela.mx
      SEED_TEACHER_PASSWORD: Escuela2026!
      PORT: '3000'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run migrate
      - run: npm run seed

      - name: Levantar el servidor
        run: |
          npm start &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 2
          done
          echo "El servidor no respondio a tiempo" && exit 1

      - name: Verificar endpoints publicos
        run: |
          curl -fsS http://localhost:3000/api/meta > /dev/null
          curl -fsS http://localhost:3000/ > /dev/null
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/api/parent/summary | grep -q 401

      - name: Verificar inicio de sesion docente
        run: |
          curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"maestra@escuela.mx","password":"Escuela2026!"}' \
            -c cookies.txt > /dev/null
          curl -fsS http://localhost:3000/api/groups -b cookies.txt | grep -q '"groups"'

  docker:
    name: Imagen y pila de contenedores
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: seguimiento_ci
      JWT_SECRET: secreto_de_contenedores_para_ci_con_longitud_suficiente
      SEED_TEACHER_EMAIL: maestra@escuela.mx
      SEED_TEACHER_PASSWORD: Escuela2026!
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Se etiqueta igual que en docker-compose.yml para que la pila reutilice esta imagen.
      - name: Construir la imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          load: true
          tags: control-seguimiento:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validar las definiciones de Compose
        run: |
          docker compose --profile tools config --quiet
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config --quiet

      - name: Verificar que el contenedor no corre como root
        run: |
          test "$(docker run --rm control-seguimiento:local id -u)" = '1000'

      - name: Levantar la pila y esperar el estado saludable
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Cargar los datos iniciales
        run: docker compose run --rm --no-build seed

      - name: Verificar la API publicada por el contenedor
        run: |
          curl -fsS http://localhost:3000/api/health
          curl -fsS http://localhost:3000/api/meta > /dev/null
          curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:3000/api/parent/summary | grep -q 401
          curl -fsS -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"maestra@escuela.mx","password":"Escuela2026!"}' \
            -c cookies.txt > /dev/null
          curl -fsS http://localhost:3000/api/groups -b cookies.txt | grep -q '"groups"'

      # Con el proveedor equivocado los nombres con acento se ordenan al final de la lista.
      - name: Verificar que la base ordena en espanol
        run: |
          docker compose exec -T db psql -U seguimiento -d control_seguimiento -tAc \
            "SELECT datlocprovider FROM pg_database WHERE datname='control_seguimiento'" | grep -qx 'i'

      - name: Verificar el cierre ordenado
        run: |
          docker compose stop app
          docker compose logs app | grep -q 'SIGTERM recibido'
          test "$(docker inspect cs-app --format '{{.State.ExitCode}}')" = '0'

      - name: Detener la pila
        if: always()
        run: docker compose down -v
